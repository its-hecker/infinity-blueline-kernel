name: Verify source parity with latest booted LineageOS Pixel 3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Compare tracked files with pinned LineageOS snapshot
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream-lineage https://github.com/its-hecker/android_kernel_google_msm-4.9.git
          git fetch --depth=1 upstream-lineage +refs/heads/lineage-24.0:refs/remotes/upstream-lineage/lineage-24.0
          SOURCE_SHA=$(git rev-parse refs/remotes/upstream-lineage/lineage-24.0)
          test "$SOURCE_SHA" = "484dddd90e130900b4f0cf0ccb5b148b263f7fb4"
          git diff --name-only "$SOURCE_SHA" HEAD > /tmp/changed.txt
          echo "Differences from the LineageOS kernel source:"
          cat /tmp/changed.txt
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/mirror-lineage.yml|.github/workflows/verify-lineage-parity.yml) ;;


              *) echo "Unexpected non-LineageOS kernel file change: $file" >&2; exit 1 ;;
            esac
          done < /tmp/changed.txt

          echo "Source parity: PASS, no unapproved old port changes"
